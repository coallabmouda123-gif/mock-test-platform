<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Test | ExamPrep</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="quiz-body">
    <!-- Reused Navigation Bar -->
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="Platform Logo" class="logo">
            <h1>ExamPrep</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#exams">End Test</a>
        </nav>
    </header>

    <main class="quiz-wrapper">
        <!-- Main Quiz Card -->
        <section class="quiz-card">
            <div class="quiz-header">
                <!-- These will be dynamically updated by JavaScript later -->
                <span id="subject-title" class="badge">English Grammar</span>
                <span id="question-tracker" class="tracker">Question 1 / 20</span>
            </div>

            <div class="question-box">
                <h2 id="question-text">Identify the correct synonym for the word: "Abundant"</h2>
            </div>

            <div class="options-container" id="options-container">
                <button class="option-btn" data-option="A">
                    <span class="option-label">A</span> Plentiful
                </button>
                <button class="option-btn" data-option="B">
                    <span class="option-label">B</span> Scarce
                </button>
                <button class="option-btn" data-option="C">
                    <span class="option-label">C</span> Minimal
                </button>
                <button class="option-btn" data-option="D">
                    <span class="option-label">D</span> Rare
                </button>
            </div>

            <div class="action-container">
                <!-- Disabled by default until the user clicks an option -->
                <button id="next-btn" class="primary-btn" disabled>Next Question</button>
            </div>
        </section>

        <!-- Bottom Ad Placement (High Conversion Zone) -->
        <div class="ad-container quiz-ad">
            <p class="ad-label">AdSense Banner (728x90)</p>
        </div>
    </main>

    <!-- This links the JavaScript file we will write in Phase 4 -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

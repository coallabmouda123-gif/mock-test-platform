<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk Question Uploader</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- PapaParse reads CSV files directly in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body style="padding: 2rem; max-width: 600px; margin: 0 auto;">
    <h2>Bulk Upload MCQs</h2>
    <p>Select your formatted CSV file to push questions to Firestore.</p>
    
    <input type="file" id="csv-file" accept=".csv" style="margin: 20px 0; display: block;">
    <button id="upload-btn" class="primary-btn">Upload to Database</button>
    
    <div id="status" style="margin-top: 20px; font-weight: bold; color: var(--color-primary);"></div>

    <script type="module">
        // Import Firebase securely via standard browser CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Your exact Firebase configuration keys
        const firebaseConfig = {
          apiKey: "AIzaSyAsBwab5_hc0pM9qCLTw7jZu4K6fSl_5xw",
          authDomain: "examprep-platform-219c3.firebaseapp.com",
          projectId: "examprep-platform-219c3",
          storageBucket: "examprep-platform-219c3.firebasestorage.app",
          messagingSenderId: "376405485969",
          appId: "1:376405485969:web:3eff3371d47852ed869230"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Handle the File Upload
        document.getElementById('upload-btn').addEventListener('click', () => {
            const file = document.getElementById('csv-file').files[0];
            const statusDiv = document.getElementById('status');
            
            if (!file) {
                statusDiv.innerText = "Please select a CSV file first.";
                return;
            }

            statusDiv.innerText = "Reading file...";

            Papa.parse(file, {
                header: true, 
                skipEmptyLines: true,
                complete: async function(results) {
                    const questions = results.data;
                    statusDiv.innerText = `Found ${questions.length} questions. Uploading...`;
                    
                    let successCount = 0;
                    
                    for (const row of questions) {
                        try {
                            await addDoc(collection(db, "questions"), row);
                            successCount++;
                            statusDiv.innerText = `Uploaded: ${successCount} / ${questions.length}`;
                        } catch (error) {
                            console.error("Error uploading row:", error);
                            statusDiv.innerText = "Upload failed. Check Firebase Database Rules.";
                        }
                    }
                    
                    statusDiv.innerText = `Upload Complete! Successfully added ${successCount} questions.`;
                    statusDiv.style.color = "var(--color-success)";
                }
            });
        });
    </script>
</body>
</html>
